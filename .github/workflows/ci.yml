name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: assistant
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@localhost:5432/assistant
      AI_MODE: demo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e . && pip install pytest ruff
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest -q
      - run: python -m app.seed
      - run: python scripts/postgres_smoke.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S desktop-agent -B desktop-agent/build -A x64
      - run: cmake --build desktop-agent/build --config Release
      - run: ctest --test-dir desktop-agent/build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python backend/scripts/agent_smoke.py desktop-agent/build/Release/daylight-agent.exe
  browser-workflows:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///e2e.db
      AI_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python -m alembic upgrade head && python -m app.seed
        working-directory: backend
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/daylight-api.log 2>&1 &
        working-directory: backend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run start > /tmp/daylight-web.log 2>&1 &
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
